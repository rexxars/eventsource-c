name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libcurl4-openssl-dev
      - run: cmake -B build -DCMAKE_BUILD_TYPE=Debug
      - run: cmake --build build
      - run: ctest --test-dir build --output-on-failure

  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build-fuzz -DSSE_BUILD_FUZZERS=ON -DSSE_BUILD_TESTS=OFF -DSSE_BUILD_POSIX_PORT=OFF -DSSE_SANITIZE=OFF -DCMAKE_C_COMPILER=clang
      - run: cmake --build build-fuzz
      - run: ./build-fuzz/fuzz_parser -max_total_time=60

  esp-idf-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.2
          target: esp32
          path: examples/esp32

  esp-qemu-test:
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:release-v5.2
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and pytest-embedded
        run: |
          git config --global --add safe.directory '*'
          . $IDF_PATH/export.sh
          python $IDF_PATH/tools/idf_tools.py install qemu-xtensa
          # pytest-embedded 1.x matches IDF 5.2's pinned esptool v4 (2.x emits
          # esptool-v5 command spellings that v4 rejects); pytest 9 postdates
          # the 1.x plugins.
          pip install "pytest~=8.3" "pytest-embedded~=1.16" \
            "pytest-embedded-idf~=1.16" "pytest-embedded-qemu~=1.16"
      - name: Build QEMU test app
        run: |
          . $IDF_PATH/export.sh
          cd tests/qemu
          idf.py set-target esp32
          idf.py build
      - name: Run on-target integration test in QEMU
        run: |
          . $IDF_PATH/export.sh
          eval "$(python $IDF_PATH/tools/idf_tools.py export)"
          cd tests/qemu
          pytest pytest_qemu.py --embedded-services idf,qemu --app-path . \
            --qemu-extra-args "-nic user,model=open_eth"
