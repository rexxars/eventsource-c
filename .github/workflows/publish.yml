# Manual fallback publisher. Normal releases go through the changesets flow
# in release.yml (merge the "chore: release" PR); this exists for re-running
# a failed upload. Tag pushes deliberately do not trigger it: tags created by
# the release workflow's token would never fire this workflow anyway.
name: Publish to ESP Component Registry
on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/upload-components-ci-action@v1
        with:
          name: eventsource
          namespace: rexxars
          api_token: ${{ secrets.IDF_COMPONENT_API_TOKEN }}
